<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>志愿者分组 · 完整功能测试版</title><style>{{STYLES}}</style></head><body>
<div class="app"><aside class="sidebar"><div class="brand"><span class="logo">⌘</span>志愿者分组</div><div class="navlabel">工作空间</div><nav class="nav" id="nav"></nav><div class="sidebar-foot"><div class="local-status"><span class="dot"></span>本地离线 · 测试版 2.0</div><div class="sidebar-project-actions"><button class="subtle" onclick="newProject()"><span aria-hidden="true">＋</span>新建活动</button><button class="subtle" onclick="$('restoreFile').click()"><span aria-hidden="true">↥</span>打开项目</button><button class="subtle" onclick="clearProject()"><span aria-hidden="true">↺</span>清空当前活动</button></div></div></aside><main class="main"><header class="topbar"><div class="crumb">我的活动　/　<button class="subtle activity-btn" id="activityName" onclick="editActivity()" title="修改活动名称">新活动 ✎</button></div><div class="top-actions"><button class="primary" onclick="autoRemaining()">一键完成剩余分配</button><button onclick="showHistory()">◷ 历史</button><button onclick="saveSnapshot('手动保存').then(ok=>ok&&toast('已保存'))">保存</button></div></header><div class="workspace"><section class="heading"><div><div class="eyebrow">VOLUNTEER WORKSPACE</div><h1 id="title">导入名单</h1><p id="subtitle"></p></div><section class="stats" id="stats"></section><div class="mode" id="viewSwitch"><button onclick="setView(false)">▦ 卡片</button><button onclick="setView(true)">☷ 列表</button></div></section><div id="mainContent"></div></div><footer class="footer" id="footerActions"><span id="saveState">正在打开本地项目…</span></footer></main></div>
<input type="file" id="files" hidden multiple accept=".xlsx,.xls,.csv" onchange="handleFiles([...this.files])"><input type="file" id="restoreFile" hidden accept=".json" onchange="restoreProject(this.files[0])"><div class="toast" id="toast" role="status"></div><dialog id="modal"><div class="dialog-head"><h2 id="modalTitle"></h2><button class="subtle icon" aria-label="关闭" onclick="closeModal()">×</button></div><div class="dialog-body" id="modalBody"></div></dialog>
{{SCRIPTS}}</body></html>
